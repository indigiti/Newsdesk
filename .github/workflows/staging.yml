name: Staging checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PHP and RSS extensions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-curl php-xml php-mbstring
          php -m
      - name: Build static frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Install browser test tooling
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Package DigiOps release
        run: |
          mkdir -p release/public/api release/private/bin release/private/build
          cp -a out/. release/public/
          cp php/api/stories.php release/public/api/
          cp php/ingest.php release/private/bin/
          php tools/package-release.php
      - name: Verify packaged inbox and PHP
        run: |
          find php tools -name '*.php' -exec php -l {} \;
          bash tests/staging-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: digiops-release
          path: release/
          if-no-files-found: error
